<style>
/* Página del jugador: un pergamino igual para todos los personajes.
   El dibujo de tu personaje sale en gris, para que el color no delate tu equipo desde lejos. */
:root {
  color-scheme: light;
  --bg: #f1e6c9;
  --card: #fbf5e4;
  --card-2: #f6eccf;
  --ink: #261d33;
  --title: #261d33;
  --muted: #6a5d4f;
  --line: #d3c29c;
  --btn: #261d33;
  --btn-ink: #fbf5e4;
  --aldeano: #2c62a6;
  --forastero: #1b7369;
  --secuaz: #a9501d;
  --demonio: #a3243a;
  --font-display: 'Grenze Gotisch', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-body: 'Alegreya Sans', 'Segoe UI', Roboto, system-ui, sans-serif;
  --font-label: 'Alegreya Sans SC', 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0c1020;
    --card: #151b30;
    --card-2: #1a2139;
    --ink: #ebe7f3;
    --title: #f3e7c5;
    --muted: #a1a7c2;
    --line: #2d3658;
    --btn: #f3e7c5;
    --btn-ink: #0c1020;
    --aldeano: #86b6ea;
    --forastero: #6cc5ba;
    --secuaz: #ec9361;
    --demonio: #e0596a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
p { margin: 0; }
h1, h2, h3 { margin: 0; }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--title); outline-offset: 3px; }
.wrap { max-width: 34rem; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px)); }

/* Cabecera y pestañas */
.top { display: flex; align-items: center; gap: 10px; padding: calc(14px + env(safe-area-inset-top, 0px)) 0 8px; color: var(--title); }
.top b { font: 700 1.5rem/1 var(--font-display); letter-spacing: .01em; }
.tabs { position: sticky; top: 0; z-index: 5; padding: 6px 0 10px; background: linear-gradient(to bottom, var(--bg) 80%, transparent); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 700 .95rem/1.1 var(--font-body); cursor: pointer; padding: 6px 4px; }
.seg button[aria-selected="true"] { background: var(--btn); color: var(--btn-ink); }

/* Tarjeta del personaje */
.eyebrow { font: 700 .9rem/1.2 var(--font-label); letter-spacing: .06em; color: var(--muted); }
.hola { font: 700 clamp(2.3rem, 11vw, 3.1rem)/1 var(--font-display); color: var(--title); overflow-wrap: anywhere; text-wrap: balance; margin: 4px 0 14px; }
.carta { border: 2px solid var(--line); border-radius: 22px; background: var(--card); padding: 22px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.tapa { min-height: 330px; justify-content: center; }
.tapa .cand { color: var(--muted); }
.tapa h2 { font: 700 1.6rem/1.1 var(--font-display); color: var(--title); }
.tapa p { color: var(--muted); max-width: 26ch; }
.med { width: 148px; height: 148px; border-radius: 50%; overflow: hidden; flex: none; border: 3px solid var(--line); background: var(--card-2); box-shadow: 0 0 0 7px color-mix(in oklab, var(--line) 45%, transparent); }
.med svg { display: block; width: 100%; height: 100%; }
.med.gris svg { filter: grayscale(1) sepia(.3); }
.eres { font: 700 1rem/1.2 var(--font-label); letter-spacing: .06em; color: var(--muted); margin-top: 4px; }
.nombre { font: 700 clamp(2.4rem, 12vw, 3.2rem)/.95 var(--font-display); color: var(--title); text-wrap: balance; }
.equipo { font-size: .95rem; color: var(--muted); }
.poder { font: 500 1.25rem/1.4 var(--font-body); max-width: 30ch; text-wrap: pretty; }
.ejemplo { color: var(--muted); font-style: italic; max-width: 32ch; }
.pista { width: 100%; text-align: left; border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: .95rem; }
.btn { appearance: none; -webkit-appearance: none; width: 100%; min-height: 56px; padding: 12px 18px; border-radius: 16px; border: 2px solid var(--btn); background: var(--btn); color: var(--btn-ink); font: 700 1.15rem/1.2 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn.sec { background: transparent; color: var(--ink); border-color: var(--line); font-size: 1rem; min-height: 48px; }
.nota { color: var(--muted); font-size: .95rem; margin-top: 14px; text-align: center; }
.vacio { min-height: 300px; justify-content: center; }
.vacio h2 { font: 700 1.7rem/1.1 var(--font-display); color: var(--title); text-wrap: balance; }
.vacio p { color: var(--muted); max-width: 30ch; }

/* Guion */
.sec-h { font: 700 2rem/1 var(--font-display); color: var(--title); margin: 6px 0 4px; }
.sub { color: var(--muted); }
.cuenta { margin: 14px 0 6px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.cuenta .num { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cuenta .num div { text-align: center; padding: 6px 2px; border-radius: 10px; background: var(--card-2); }
.cuenta .num b { display: block; font: 800 1.35rem/1.1 var(--font-body); font-variant-numeric: tabular-nums; }
.cuenta .num span { font-size: .78rem; color: var(--muted); line-height: 1.1; display: block; }
.cuenta p { font-size: .9rem; color: var(--muted); }
.t-aldeano { --team: var(--aldeano); }
.t-forastero { --team: var(--forastero); }
.t-secuaz { --team: var(--secuaz); }
.t-demonio { --team: var(--demonio); }
.cuenta .num b { color: var(--team); }
.grupo { margin-top: 20px; }
.grupo h3 { display: flex; align-items: baseline; gap: 8px; font: 700 1rem/1.2 var(--font-label); letter-spacing: .07em; color: var(--team); padding-bottom: 6px; border-bottom: 2px solid var(--team); }
.grupo h3 small { font: 500 .85rem var(--font-body); letter-spacing: 0; color: var(--muted); }
.lista { list-style: none; margin: 0; padding: 0; }
.lista li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lista .mini { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; border: 2px solid var(--team); background: var(--card-2); }
.lista .mini svg { display: block; width: 100%; height: 100%; }
.lista b { font: 700 1.35rem/1.05 var(--font-display); color: var(--title); }
.lista p { font-size: 1rem; margin-top: 3px; }
.lista p.ej { color: var(--muted); font-style: italic; font-size: .92rem; }
details.tabla { margin-top: 2px; }
details.tabla summary { cursor: pointer; font-size: .9rem; font-weight: 700; color: var(--ink); }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; font-size: .92rem; }
th, td { padding: 4px 2px; text-align: center; border-bottom: 1px solid var(--line); }
th { font: 700 .78rem var(--font-label); letter-spacing: .04em; color: var(--muted); }
td.yo { font-weight: 800; color: var(--title); }

/* Reglas */
.reglas { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; counter-reset: r; }
.reglas li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
.reglas li::before { counter-increment: r; content: counter(r); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--title); font: 700 1rem/1 var(--font-display); }
.reglas b { display: block; font: 700 1.3rem/1.1 var(--font-display); color: var(--title); margin-bottom: 2px; }
.creditos { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem; text-align: center; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .carta { animation: entra .25s ease-out both; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>

ircle cx=\"118.1\" cy=\"191.2\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"81.9\" cy=\"191.2\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"48.3\" cy=\"177.3\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"22.7\" cy=\"151.7\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"8.8\" cy=\"118.1\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"8.8\" cy=\"81.9\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"22.7\" cy=\"48.3\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"48.3\" cy=\"22.7\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"81.9\" cy=\"8.8\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"118.1\" cy=\"8.8\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"151.7\" cy=\"22.7\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"177.3\" cy=\"48.3\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"191.2\" cy=\"81.9\" r=\"2.2\" fill=\"#f6a86d\"/><circle cx=\"100\" cy=\"100\" r=\"99\" fill=\"none\" stroke=\"#24182f\" stroke-width=\"4.5\"/><\/svg>"};
</script>
<script>
/* Doce campanadas · página del jugador.
   El QR del narrador trae, después del #, tu asiento, tu personaje, el modo, cuántos juegan y tu nombre.
   Lo que va después del # nunca sale de tu celular: el servidor no lo recibe. */
(function () {
  'use strict';
  const D = window.DOCE, ARTE = window.DOCE_ARTE || {}, PJ = D.PERSONAJES;
  const app = document.getElementById('app');
  const S = { pest: 'personaje', visible: false, dato: null };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function art(id) { const p = PJ[id]; return (p.f === 'a' ? 'la ' : 'el ') + p.nombre; }
  function poder(id, modo) { const p = PJ[id]; return modo === 'a' ? (p.poderAprendiz || p.poder) : (p.poderCompleto || p.poder); }
  function ejemplo(id, modo) { const p = PJ[id]; return modo === 'a' ? (p.ejemploAprendiz || p.ejemplo) : p.ejemplo; }

  function leer() {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return { estado: 'vacio' };
    try {
      let b = h.replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      const bin = atob(b), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const p = new TextDecoder('utf-8').decode(bytes).split('|');
      const c = p[2], n = parseInt(p[4], 10);
      if (p[0] !== '1' || !PJ[c]) throw new Error('no válido');
      return {
        estado: 'ok', asiento: parseInt(p[1], 10) || null, personaje: c, modo: p[3] === 'a' ? 'a' : 'c',
        n: n >= D.MIN && n <= D.MAX ? n : null, nombre: p.slice(5).join('|').trim()
      };
    } catch (e) {
      return { estado: 'malo' };
    }
  }

  const I = {
    campanas: '<svg viewBox="0 0 120 92" width="40" height="31" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M14 20h92M20 20V8h80v12"/><path d="M40 24c-9 2-13 10-13 20v12l-6 8h38l-6-8V44c0-10-4-18-13-20z"/><path d="M80 24c-9 2-13 10-13 20v12l-6 8h38l-6-8V44c0-10-4-18-13-20z"/><path d="M40 64v6M80 64v6"/></g></svg>',
    candado: '<svg viewBox="0 0 24 24" width="54" height="54" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><path d="M12 15v2"/></svg>',
    camara: '<svg viewBox="0 0 24 24" width="54" height="54" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    ojo: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
  };

  function vPersonaje() {
    const d = S.dato;
    if (d.estado === 'vacio') {
      return '<div class="carta vacio"><span class="eyebrow">Tu personaje</span><span style="color:var(--muted)">' + I.camara + '</span>' +
        '<h2>Escanea el QR que te muestra el narrador</h2><p>Con la cámara de tu celular. Ahí verás tu personaje. Mientras tanto, puedes leer el guion y las reglas.</p></div>';
    }
    if (d.estado === 'malo') {
      return '<div class="carta vacio"><h2>Este enlace no trae un personaje</h2><p>Pídele al narrador que te muestre tu QR otra vez y escanéalo de nuevo.</p></div>';
    }
    const c = d.personaje, p = PJ[c], tipo = D.TIPOS[p.tipo];
    let h = '<p class="eyebrow">' + (d.asiento ? 'Asiento ' + d.asiento : 'Tu personaje') + (d.n ? ' · ' + d.n + ' jugadores' : '') + ' · ' + (d.modo === 'a' ? 'modo aprendiz' : 'modo completo') + '</p>' +
      '<h1 class="hola">' + (d.nombre ? 'Hola, ' + esc(d.nombre) : 'Hola') + '</h1>';
    if (!S.visible) {
      return h + '<div class="carta tapa"><span class="cand">' + I.candado + '</span><h2>Tu personaje está tapado</h2>' +
        '<p>Que nadie más vea tu pantalla.</p><button class="btn" data-act="ver">' + I.ojo + ' Ver mi personaje</button></div>' +
        '<p class="nota">Si el narrador te muestra otro QR, escanéalo: tu personaje cambió.</p>';
    }
    const malo = tipo.equipo === 'mal';
    let pista = '';
    if (malo && d.n) pista = d.n >= 7 ? 'La primera noche el narrador te muestra quién más está en el equipo malvado.' : 'Con menos de 7 jugadores, el equipo malvado no se conoce entre sí.';
    return h + '<div class="carta">' +
      '<div class="med gris">' + (ARTE[c] || '') + '</div>' +
      '<p class="eres">Eres</p><h2 class="nombre">' + esc(art(c)) + '</h2>' +
      '<p class="equipo">' + esc(tipo.nombre) + ' · equipo ' + (malo ? 'malvado' : 'bueno') + '</p>' +
      '<p class="poder">' + esc(poder(c, d.modo)) + '</p>' +
      '<p class="ejemplo">' + esc(ejemplo(c, d.modo)) + '</p>' +
      (pista ? '<p class="pista">' + esc(pista) + '</p>' : '') +
      '<button class="btn sec" data-act="tapar">Tapar</button></div>' +
      '<p class="nota">Puedes decir lo que quieras, incluso mentir. Lo que no se vale es mostrar esta pantalla.</p>';
  }

  function cuentaDe(n) {
    const r = D.REPARTO[n];
    return '<div class="cuenta"><span class="eyebrow">Con ' + n + ' jugadores hay</span><div class="num">' +
      D.ORDEN_TIPOS.map(function (t) {
        return '<div class="t-' + t + '"><b>' + r[t] + '</b><span>' + esc(r[t] === 1 ? D.TIPOS[t].nombre : D.TIPOS[t].plural) + '</span></div>';
      }).join('') + '</div><p>El Barón, si está en juego, cambia 2 aldeanos por 2 forasteros.' + (n > 15 ? ' Con más de 15 jugadores algunos personajes se repiten.' : '') + '</p></div>';
  }
  function tabla(yo) {
    let h = '<details class="tabla"><summary>Ver la tabla para 5 a 15 jugadores</summary><table><thead><tr><th>Jug.</th>' +
      D.ORDEN_TIPOS.map(function (t) { return '<th>' + esc(D.TIPOS[t].plural) + '</th>'; }).join('') + '</tr></thead><tbody>';
    for (let n = 5; n <= 15; n++) {
      const r = D.REPARTO[n], c = n === yo ? ' class="yo"' : '';
      h += '<tr><td' + c + '>' + n + '</td>' + D.ORDEN_TIPOS.map(function (t) { return '<td' + c + '>' + r[t] + '</td>'; }).join('') + '</tr>';
    }
    return h + '</tbody></table></details>';
  }

  function vGuion() {
    const d = S.dato, modo = d.estado === 'ok' ? d.modo : 'c';
    const ids = modo === 'a' ? D.APRENDIZ : D.ORDEN;
    let h = '<h2 class="sec-h">El guion</h2><p class="sub">' + (modo === 'a' ? 'Modo aprendiz · ' + ids.length + ' personajes, sin información falsa.' : 'Modo completo · ' + ids.length + ' personajes.') + ' Solo algunos están en juego.</p>';
    if (d.estado === 'ok' && d.n) h += cuentaDe(d.n);
    h += '<div class="cuenta" style="margin-top:' + (d.estado === 'ok' && d.n ? '8px' : '14px') + '">' + tabla(d.estado === 'ok' ? d.n : null) + '</div>';
    D.ORDEN_TIPOS.forEach(function (t) {
      const g = ids.filter(function (id) { return PJ[id].tipo === t; });
      if (!g.length) return;
      h += '<section class="grupo t-' + t + '"><h3>' + esc(D.TIPOS[t].plural) + ' <small>' + (D.TIPOS[t].equipo === 'mal' ? 'equipo malvado' : 'equipo bueno') + '</small></h3><ul class="lista">' +
        g.map(function (id) {
          return '<li><span class="mini">' + (ARTE[id] || '') + '</span><div><b>' + esc(PJ[id].nombre) + '</b><p>' + esc(poder(id, modo)) + '</p><p class="ej">' + esc(ejemplo(id, modo)) + '</p></div></li>';
        }).join('') + '</ul></section>';
    });
    return h;
  }

  function vReglas() {
    const d = S.dato, modo = d.estado === 'ok' ? d.modo : 'c';
    const R = [
      ['Dos equipos', 'Los buenos, aldeanos y forasteros, buscan al demonio. Los malvados, el demonio y sus secuaces, se esconden y mienten.'],
      ['Tu personaje es secreto', 'Puedes decir lo que quieras, incluso mentir, pero no muestras tu pantalla ni tu carta.'],
      ['La noche', 'Todos cierran los ojos. El narrador despierta a algunos jugadores en silencio para que usen su poder o reciban información.'],
      ['El día', 'Se conversa en grupo o en privado. Luego cada jugador vivo puede nominar a alguien una vez por día, y a cada jugador lo pueden nominar una vez por día.'],
      ['Votar', 'Para ejecutar a alguien se necesitan los votos de al menos la mitad de los vivos y más votos que cualquier otro nominado ese día. Si hay empate, no se ejecuta a nadie por esa votación.'],
      ['Los muertos', 'Siguen jugando y hablando, pero ya no nominan ni tienen poder. Les queda un solo voto, el voto fantasma, para el resto de la partida.']
    ];
    if (modo !== 'a') R.push(['Información falsa', 'El Borracho y quien esté envenenado reciben información que puede ser falsa, y el Ermitaño y la Espía pueden engañar a los poderes. Nadie tiene la verdad asegurada.']);
    R.push(['Quién gana', 'Gana el bien si muere el demonio. Gana el mal si solo quedan 2 vivos. Algunos personajes, como el Santo y el Alcalde, cambian esto.']);
    return '<h2 class="sec-h">Cómo se juega</h2><p class="sub">Lo básico para tu primera partida.</p><ol class="reglas">' +
      R.map(function (x) { return '<li><div><b>' + esc(x[0]) + '</b><p>' + esc(x[1]) + '</p></div></li>'; }).join('') + '</ol>';
  }

  function render() {
    const tabs = [['personaje', 'Tu personaje'], ['guion', 'El guion'], ['reglas', 'Reglas']];
    let h = '<header class="top">' + I.campanas + '<b>Doce campanadas</b></header>' +
      '<nav class="tabs"><div class="seg" role="tablist">' + tabs.map(function (t) {
        return '<button role="tab" data-act="pest" data-v="' + t[0] + '" aria-selected="' + (S.pest === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div></nav><main>';
    if (S.pest === 'guion') h += vGuion();
    else if (S.pest === 'reglas') h += vReglas();
    else h += vPersonaje();
    h += '</main><p class="creditos">Doce campanadas es una adaptación con reglas en nuestras propias palabras y dibujos originales, inspirada en el guion Trouble Brewing de Blood on the Clocktower, de The Pandemonium Institute.</p>';
    app.innerHTML = h;
  }

  app.addEventListener('click', function (ev) {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const a = t.getAttribute('data-act');
    if (a === 'ver') S.visible = true;
    else if (a === 'tapar') S.visible = false;
    else if (a === 'pest') { S.pest = t.getAttribute('data-v'); S.visible = false; window.scrollTo(0, 0); }
    render();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && S.visible) { S.visible = false; render(); }
  });
  window.addEventListener('hashchange', function () { S.dato = leer(); S.visible = false; S.pest = 'personaje'; render(); });

  S.dato = leer();
  render();
})();
</script>
